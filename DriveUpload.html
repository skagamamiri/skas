<!doctype html>
<html><head><base target="_top"><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;background:#f8fafc;color:#0b2b4a;margin:0;padding:18px}.card{background:white;border:1px solid #dfe7ef;border-radius:14px;padding:18px}.tag{display:inline-block;background:#edf6ff;color:#126da5;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700}h2{margin:10px 0 5px;font-size:20px}p{font-size:12px;color:#718096;line-height:1.5}.targets{background:#f4f8fb;border:1px solid #e2eaf1;border-radius:10px;padding:10px;font-size:11px;line-height:1.5;max-height:100px;overflow:auto}input[type=file]{width:100%;box-sizing:border-box;border:1px dashed #a9bfd2;padding:13px;border-radius:10px;background:#fbfdff;margin:12px 0}.btn{border:0;background:#126fb1;color:white;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:10px;font-size:11px;color:#52677f}.ok{color:#16834a}.err{color:#c62828}.hint{font-size:10px;color:#8a98a8;margin-top:8px}
</style></head><body><div class="card"><span class="tag">SK@S DIGITAL</span><h2>Upload Fail ke Google Drive</h2><p>Folder akan dibuat secara automatik mengikut pecahan instrumen.</p><div id="targets" class="targets">Memuatkan...</div><form id="form" onsubmit="submitForm(this);return false;"><input id="file" name="file" type="file" required><input id="payload" name="payload" type="hidden"><button id="btn" class="btn" type="submit">⬆ Upload Fail</button></form><div id="status" class="status"></div><div class="hint">Fail asal disimpan sekali. Jika satu eviden mempunyai beberapa pecahan, folder tambahan menerima shortcut ke fail asal.</div></div>
<script>
const raw='<?!= targets ?>';
let targets=[];try{targets=JSON.parse(decodeURIComponent(raw))}catch(e){targets=[]}
document.getElementById('payload').value=JSON.stringify({targets});
document.getElementById('targets').innerHTML=targets.length?targets.map(t=>'📁 '+escapeHtml(t.pathLabel||t.name||t.id)).join('<br>'):'Tiada pecahan dipilih.';
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function submitForm(form){const file=document.getElementById('file').files[0];if(!file)return;const btn=document.getElementById('btn'),status=document.getElementById('status');btn.disabled=true;status.textContent='Sedang upload ke Google Drive...';google.script.run.withSuccessHandler(function(result){status.innerHTML='<span class="ok">✓ Upload berjaya.</span>';window.parent.postMessage({type:'SKAS_DRIVE_UPLOAD_SUCCESS',result},'*');setTimeout(()=>{btn.disabled=false},800)}).withFailureHandler(function(err){status.innerHTML='<span class="err">Gagal: '+escapeHtml(err&&err.message?err.message:String(err))+'</span>';window.parent.postMessage({type:'SKAS_DRIVE_UPLOAD_ERROR',message:err&&err.message?err.message:String(err)},'*');btn.disabled=false}).uploadEvidence(form);}
</script></body></html>
